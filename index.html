<!DOCTYPE html>
<html>
<head>
    <title>Vortex Troopers | Live Sync Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        body { margin: 0; background: #1a1a1a; }
        #map { height: 100vh; width: 100%; }
        .status-indicator {
            position: absolute; top: 10px; right: 10px; z-index: 1000;
            background: rgba(0,0,0,0.7); color: #0f0; padding: 5px 10px;
            font-family: monospace; font-size: 12px; border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="status-indicator" id="sync-status">SYNCED WITH FILE</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
    var map = L.map('map').setView([35.4676, -97.5164], 6);
    
    // Dark Map Base
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    // NWS Radar Overlay
    L.tileLayer.wms("https://nowcoast.noaa.gov/arcgis/services/nowcoast/radar_meteo_radiat_nexrad_reflectivity_v1/MapServer/WmsServer", {
        layers: '1', format: 'image/png', transparent: true, opacity: 0.6
    }).addTo(map);

    var targetLayer = L.layerGroup().addTo(map);

    // THE UPDATE FUNCTION
    async function updateMapFromFile() {
        try {
            // Fetch the JSON file (adding a timestamp prevents browser caching)
            const response = await fetch('targets.json?t=' + new Date().getTime());
            const data = await response.json();

            // Clear old targets
            targetLayer.clearLayers();

            // Draw new targets from the file
            data.forEach(target => {
                L.polygon(target.coords, {
                    color: target.color,
                    fillColor: target.color,
                    fillOpacity: 0.4
                })
                .bindPopup("Prob: " + target.probability + "%")
                .addTo(targetLayer);
            });

            document.getElementById('sync-status').innerText = "LIVE - UPDATED: " + new Date().toLocaleTimeString();
            document.getElementById('sync-status').style.color = "#0f0";
        } catch (err) {
            console.error("Update failed:", err);
            document.getElementById('sync-status').innerText = "SYNC ERROR";
            document.getElementById('sync-status').style.color = "red";
        }
    }

    // Run update every 30 seconds
    setInterval(updateMapFromFile, 30000); 
    
    // Initial run
    updateMapFromFile();
</script>
</body>
</html>
